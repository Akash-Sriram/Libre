name: Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *' # Check daily at midnight UTC
  repository_dispatch:
    types: [upstream_sync]
  workflow_dispatch: # Allow instant manual trigger from GitHub UI / CLI

jobs:
  sync_newpipe_extractor:
    name: Sync latest NewPipeExtractor from upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync NewPipeExtractor and Trigger Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          LATEST_NPE_COMMIT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/libre-tube/NewPipeExtractor/commits?sha=dev" | jq -r '.[0].sha' | cut -c1-9)
          if [ "$LATEST_NPE_COMMIT" != "null" ] && [ ! -z "$LATEST_NPE_COMMIT" ]; then
            echo "Latest NewPipeExtractor dev commit: $LATEST_NPE_COMMIT"
            sed -i "s/newpipeextractor = \"[^\"]*\"/newpipeextractor = \"$LATEST_NPE_COMMIT\"/g" gradle/libs.versions.toml
          else
            echo "Failed to fetch latest NPE commit from GitHub API."
          fi
          
          git add gradle/libs.versions.toml
          if ! git diff-index --quiet HEAD; then
            git commit -m "ci: auto-update NewPipeExtractor to dev commit $LATEST_NPE_COMMIT"
            git push origin master
            echo "New commit detected. Triggering release build pipeline..."
            gh workflow run build-release.yml --ref master
          else
            echo "NewPipeExtractor is already up to date ($LATEST_NPE_COMMIT)."
          fi
